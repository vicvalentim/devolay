name: Maven Central release upload

on:
  workflow_dispatch:
    inputs:
      release:
        description: Confirm the Maven Central staged upload
        required: true
        type: choice
        options:
          - UPLOAD 2.2.0-vic.2

permissions:
  contents: read

concurrency:
  group: central-staging-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "11"
  NATIVE_JAR: >-
    devolay-natives/build/tmp/assembleNativeArtifacts/devolay-native-artifacts.jar

jobs:
  native-linux-windows:
    name: Linux and Windows natives
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install native toolchains
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            mingw-w64 \
            unzip

          chmod +x gradlew
          chmod +x .github/workflows/g++-faker.py

          sudo ln -sf \
            "$GITHUB_WORKSPACE/.github/workflows/g++-faker.py" \
            /usr/bin/i686-w64-mingw32-g++-faker

          sudo ln -sf \
            "$GITHUB_WORKSPACE/.github/workflows/g++-faker.py" \
            /usr/bin/x86_64-w64-mingw32-g++-faker

      - name: Build Linux and Windows natives
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            :devolay-natives:assembleNativeArtifacts \
            --rerun-tasks

      - name: Validate Linux and Windows natives
        run: |
          set -euo pipefail

          test -f "$NATIVE_JAR"

          entries="$(jar tf "$NATIVE_JAR")"
          printf '%s\n' "$entries"

          expected_directories=(
            "natives/linux/x86"
            "natives/linux/x86-64"
            "natives/windows/x86"
            "natives/windows/x86-64"
          )

          for directory in "${expected_directories[@]}"; do
            if ! grep -Eq \
              "^${directory}/[^/]+\.(so|dll)$" \
              <<<"$entries"; then
              echo "Missing native binary in ${directory}" >&2
              exit 1
            fi
          done

          if grep -Eiq \
            'libndi|integrated|\.dwarf$|\.debug$' \
            <<<"$entries"; then
            echo "Forbidden file found in native artifact." >&2
            exit 1
          fi

      - name: Prepare Linux and Windows artifact
        run: |
          set -euo pipefail

          mkdir -p build/ci-artifacts

          cp \
            "$NATIVE_JAR" \
            build/ci-artifacts/devolay-native-linux-windows.jar

      - name: Upload Linux and Windows natives
        uses: actions/upload-artifact@v7
        with:
          name: native-linux-windows
          path: >-
            build/ci-artifacts/devolay-native-linux-windows.jar
          if-no-files-found: error
          retention-days: 1

  native-macos-x86-64:
    name: macOS Intel native
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Verify Intel runner
        run: |
          set -euo pipefail

          echo "uname -m: $(uname -m)"
          test "$(uname -m)" = "x86_64"

      - name: Build macOS Intel native
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            :devolay-natives:stripSymbolsReleaseMacosX86-64 \
            --rerun-tasks

      - name: Validate macOS Intel binary
        run: |
          set -euo pipefail

          dylib="devolay-natives/build/lib/main/release/macos/x86-64/stripped/libdevolay-natives.dylib"

          test -f "$dylib"

          file "$dylib"

          archs="$(lipo -archs "$dylib")"
          echo "Architectures: $archs"

          if [ "$archs" != "x86_64" ]; then
            echo "ERROR: macOS Intel binary must be x86_64, got: $archs" >&2
            exit 1
          fi

          shasum -a 256 "$dylib"

      - name: Prepare macOS Intel artifact
        run: |
          set -euo pipefail

          dylib="devolay-natives/build/lib/main/release/macos/x86-64/stripped/libdevolay-natives.dylib"
          tree="build/ci-artifacts/macos-x86-64"

          rm -rf "$tree"
          mkdir -p "$tree/natives/macos/x86-64"

          cp \
            "$dylib" \
            "$tree/natives/macos/x86-64/libdevolay-natives.dylib"

          jar \
            --create \
            --file build/ci-artifacts/devolay-native-macos-x86-64.jar \
            -C "$tree" .

          jar tf build/ci-artifacts/devolay-native-macos-x86-64.jar

      - name: Upload macOS Intel native
        uses: actions/upload-artifact@v7
        with:
          name: native-macos-x86-64
          path: build/ci-artifacts/devolay-native-macos-x86-64.jar
          if-no-files-found: error
          retention-days: 1

  native-macos-aarch64:
    name: macOS Apple Silicon native
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Verify Apple Silicon runner
        run: |
          set -euo pipefail

          echo "uname -m: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Build macOS Apple Silicon native
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            :devolay-natives:stripSymbolsReleaseMacosAarch64 \
            --rerun-tasks

      - name: Validate macOS Apple Silicon binary
        run: |
          set -euo pipefail

          dylib="devolay-natives/build/lib/main/release/macos/aarch64/stripped/libdevolay-natives.dylib"

          test -f "$dylib"

          file "$dylib"

          archs="$(lipo -archs "$dylib")"
          echo "Architectures: $archs"

          if [ "$archs" != "arm64" ]; then
            echo "ERROR: macOS Apple Silicon binary must be arm64, got: $archs" >&2
            exit 1
          fi

          shasum -a 256 "$dylib"

      - name: Prepare macOS Apple Silicon artifact
        run: |
          set -euo pipefail

          dylib="devolay-natives/build/lib/main/release/macos/aarch64/stripped/libdevolay-natives.dylib"
          tree="build/ci-artifacts/macos-aarch64"

          rm -rf "$tree"
          mkdir -p "$tree/natives/macos/aarch64"

          cp \
            "$dylib" \
            "$tree/natives/macos/aarch64/libdevolay-natives.dylib"

          jar \
            --create \
            --file build/ci-artifacts/devolay-native-macos-aarch64.jar \
            -C "$tree" .

          jar tf build/ci-artifacts/devolay-native-macos-aarch64.jar

      - name: Upload macOS Apple Silicon native
        uses: actions/upload-artifact@v7
        with:
          name: native-macos-aarch64
          path: build/ci-artifacts/devolay-native-macos-aarch64.jar
          if-no-files-found: error
          retention-days: 1

  central-staging:
    name: Assemble and upload Maven Central release
    needs:
      - native-linux-windows
      - native-macos-x86-64
      - native-macos-aarch64
    runs-on: ubuntu-22.04
    environment: maven-central

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Download Linux and Windows natives
        uses: actions/download-artifact@v8
        with:
          name: native-linux-windows
          path: build/native-input/linux-windows

      - name: Download macOS Intel native
        uses: actions/download-artifact@v8
        with:
          name: native-macos-x86-64
          path: build/native-input/macos-x86-64

      - name: Download macOS Apple Silicon native
        uses: actions/download-artifact@v8
        with:
          name: native-macos-aarch64
          path: build/native-input/macos-aarch64

      - name: Assemble universal native JAR
        run: |
          set -euo pipefail

          linux_windows_jar="build/native-input/linux-windows/devolay-native-linux-windows.jar"
          macos_x86_jar="build/native-input/macos-x86-64/devolay-native-macos-x86-64.jar"
          macos_arm_jar="build/native-input/macos-aarch64/devolay-native-macos-aarch64.jar"
          native_tree="build/universal-native-tree"
          universal_jar="build/universal-native-artifacts.jar"

          test -f "$linux_windows_jar"
          test -f "$macos_x86_jar"
          test -f "$macos_arm_jar"

          rm -rf "$native_tree"
          mkdir -p "$native_tree"

          unzip -q -o "$linux_windows_jar" -d "$native_tree"
          unzip -q -o "$macos_x86_jar" -d "$native_tree"
          unzip -q -o "$macos_arm_jar" -d "$native_tree"

          rm -rf "$native_tree/META-INF"

          jar \
            --create \
            --file "$universal_jar" \
            -C "$native_tree" .

          entries="$(jar tf "$universal_jar")"
          printf '%s\n' "$entries"

          expected_directories=(
            "natives/linux/x86"
            "natives/linux/x86-64"
            "natives/windows/x86"
            "natives/windows/x86-64"
            "natives/macos/x86-64"
            "natives/macos/aarch64"
          )

          for directory in "${expected_directories[@]}"; do
            if ! grep -Eq \
              "^${directory}/[^/]+\.(so|dll|dylib)$" \
              <<<"$entries"; then
              echo "Missing native binary in ${directory}" >&2
              exit 1
            fi
          done

          if grep -Eiq \
            'libndi|integrated|\.dwarf$|\.debug$|natives/android/' \
            <<<"$entries"; then
            echo "Forbidden file found in universal artifact." >&2
            exit 1
          fi

          x86_dylib="$native_tree/natives/macos/x86-64/libdevolay-natives.dylib"
          arm_dylib="$native_tree/natives/macos/aarch64/libdevolay-natives.dylib"

          test -f "$x86_dylib"
          test -f "$arm_dylib"

          echo "macOS Intel binary in universal artifact:"
          x86_description="$(file "$x86_dylib")"
          echo "$x86_description"

          if ! grep -q 'Mach-O' <<<"$x86_description" ||
             ! grep -q 'x86_64' <<<"$x86_description" ||
             grep -q 'arm64' <<<"$x86_description"; then
            echo "Invalid macOS Intel binary in universal artifact." >&2
            exit 1
          fi

          echo "macOS Apple Silicon binary in universal artifact:"
          arm_description="$(file "$arm_dylib")"
          echo "$arm_description"

          if ! grep -q 'Mach-O' <<<"$arm_description" ||
             ! grep -q 'arm64' <<<"$arm_description" ||
             grep -q 'x86_64' <<<"$arm_description"; then
            echo "Invalid macOS Apple Silicon binary in universal artifact." >&2
            exit 1
          fi

          sha256sum "$x86_dylib" "$arm_dylib"

      - name: Generate Maven staging repository
        run: |
          set -euo pipefail

          rm -rf devolay-java/build/staging-deploy

          ./gradlew \
            --no-daemon \
            -PprebuiltNativeArtifacts="$GITHUB_WORKSPACE/build/universal-native-artifacts.jar" \
            :devolay-java:publishDevolayPublicationToStagingRepository \
            --rerun-tasks

      - name: Validate Maven staging repository
        run: |
          set -euo pipefail

          version="$(
            python3 - <<'PY_VERSION'
          import re
          from pathlib import Path

          text = Path("build.gradle.kts").read_text(
              encoding="utf-8"
          )

          match = re.search(
              r'^\s*version\s*=\s*"([^"]+)"',
              text,
              re.MULTILINE,
          )

          if not match:
              raise SystemExit(
                  "Project version was not found."
              )

          print(match.group(1))
          PY_VERSION
          )"

          stage="devolay-java/build/staging-deploy/io/github/vicvalentim/devolay/${version}"
          main_jar="${stage}/devolay-${version}.jar"
          module_file="${stage}/devolay-${version}.module"
          pom_file="${stage}/devolay-${version}.pom"

          expected_files=(
            "$main_jar"
            "${stage}/devolay-${version}-sources.jar"
            "${stage}/devolay-${version}-javadoc.jar"
            "$pom_file"
            "$module_file"
          )

          for file in "${expected_files[@]}"; do
            test -f "$file"
          done

          if find "$stage" \
            -maxdepth 1 \
            -type f \
            | grep -Eiq '\.aar$|integrated'; then
            echo "AAR or integrated artifact found." >&2
            exit 1
          fi

          entries="$(jar tf "$main_jar")"
          printf '%s\n' "$entries"

          expected_directories=(
            "natives/linux/x86"
            "natives/linux/x86-64"
            "natives/windows/x86"
            "natives/windows/x86-64"
            "natives/macos/x86-64"
            "natives/macos/aarch64"
          )

          for directory in "${expected_directories[@]}"; do
            if ! grep -Eq \
              "^${directory}/[^/]+\.(so|dll|dylib)$" \
              <<<"$entries"; then
              echo "Missing native binary in ${directory}" >&2
              exit 1
            fi
          done

          if grep -Eiq \
            'libndi|integrated|\.dwarf$|\.debug$|natives/android/' \
            <<<"$entries"; then
            echo "Forbidden file found in Maven JAR." >&2
            exit 1
          fi

          arch_check_dir="$(mktemp -d)"

          mkdir -p \
            "$arch_check_dir/x86-64" \
            "$arch_check_dir/aarch64"

          unzip -p \
            "$main_jar" \
            natives/macos/x86-64/libdevolay-natives.dylib \
            > "$arch_check_dir/x86-64/libdevolay-natives.dylib"

          unzip -p \
            "$main_jar" \
            natives/macos/aarch64/libdevolay-natives.dylib \
            > "$arch_check_dir/aarch64/libdevolay-natives.dylib"

          x86_dylib="$arch_check_dir/x86-64/libdevolay-natives.dylib"
          arm_dylib="$arch_check_dir/aarch64/libdevolay-natives.dylib"

          x86_description="$(file "$x86_dylib")"
          arm_description="$(file "$arm_dylib")"

          echo "Maven JAR macOS Intel binary:"
          echo "$x86_description"

          if ! grep -q 'Mach-O' <<<"$x86_description" ||
             ! grep -q 'x86_64' <<<"$x86_description" ||
             grep -q 'arm64' <<<"$x86_description"; then
            echo "Invalid macOS Intel binary in Maven JAR." >&2
            exit 1
          fi

          echo "Maven JAR macOS Apple Silicon binary:"
          echo "$arm_description"

          if ! grep -q 'Mach-O' <<<"$arm_description" ||
             ! grep -q 'arm64' <<<"$arm_description" ||
             grep -q 'x86_64' <<<"$arm_description"; then
            echo "Invalid macOS Apple Silicon binary in Maven JAR." >&2
            exit 1
          fi

          sha256sum "$x86_dylib" "$arm_dylib"
          rm -rf "$arch_check_dir"

          if grep -Eiq \
            'integrated|ndi-lib|integratedApiElements|integratedRuntimeElements' \
            "$module_file"; then
            echo "Integrated variant found in Gradle metadata." >&2
            exit 1
          fi

          grep -q \
            '<groupId>io.github.vicvalentim</groupId>' \
            "$pom_file"

          grep -q \
            '<artifactId>devolay</artifactId>' \
            "$pom_file"

      - name: Create temporary JReleaser validation configuration
        run: |
          set -euo pipefail

          python3 - <<'PY_JRELEASER'
          from pathlib import Path

          source = Path("jreleaser.yml")
          target = Path("build/jreleaser-validation.yml")

          text = source.read_text(encoding="utf-8")

          old_signing = "\n".join([
              "signing:",
              "  active: ALWAYS",
              "  pgp:",
              "    active: ALWAYS",
              "    armored: true",
              "",
          ])

          new_signing = "\n".join([
              "signing:",
              "  active: NEVER",
              "  pgp:",
              "    active: NEVER",
              "    armored: true",
              "",
          ])

          if old_signing not in text:
              raise SystemExit(
                  "Expected signing block was not found."
              )

          text = text.replace(
              old_signing,
              new_signing,
              1,
          )

          old_rules = "\n".join([
              "        applyMavenCentralRules: true",
              "        stage: UPLOAD",
          ])

          new_rules = "\n".join([
              "        applyMavenCentralRules: false",
              "        verifyPom: false",
              "        sign: false",
              "        stage: UPLOAD",
          ])

          if old_rules not in text:
              raise SystemExit(
                  "Expected Maven Central block was not found."
              )

          text = text.replace(
              old_rules,
              new_rules,
              1,
          )

          target.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          target.write_text(
              text,
              encoding="utf-8",
          )

          print(f"Created {target}")
          PY_JRELEASER

      - name: Create temporary JReleaser upload configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_JRELEASER_UPLOAD'
          from pathlib import Path

          source = Path("jreleaser.yml")
          target = Path("build/jreleaser-upload.yml")
          text = source.read_text(encoding="utf-8")

          old_rules = "\n".join([
              "        applyMavenCentralRules: true",
              "        stage: UPLOAD",
          ])

          new_rules = "\n".join([
              "        applyMavenCentralRules: false",
              "        verifyPom: false",
              "        sign: true",
              "        checksums: true",
              "        sourceJar: true",
              "        javadocJar: true",
              "        stage: UPLOAD",
          ])

          if old_rules not in text:
              raise SystemExit("Expected Maven Central block was not found.")

          text = text.replace(old_rules, new_rules, 1)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text, encoding="utf-8")
          print(f"Created {target}")
          PY_JRELEASER_UPLOAD

          grep -q '^        authorization: BEARER$' \
            build/jreleaser-upload.yml \
            || {
              echo "ERROR: Maven Central authorization must be BEARER."
              exit 1
            }

      - name: Install PomChecker
        run: |
          set -euo pipefail

          pomchecker_version="1.15.0"
          pomchecker_root="$RUNNER_TEMP/pomchecker-${pomchecker_version}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --output "$RUNNER_TEMP/pomchecker.zip" \
            "https://github.com/kordamp/pomchecker/releases/download/v${pomchecker_version}/pomchecker-${pomchecker_version}.zip"

          rm -rf "$pomchecker_root"
          unzip -q "$RUNNER_TEMP/pomchecker.zip" -d "$RUNNER_TEMP"

          pomchecker_bin="$pomchecker_root/bin/pomchecker"

          if [ ! -f "$pomchecker_bin" ]; then
            echo "PomChecker executable was not found:" >&2
            find "$RUNNER_TEMP" \
              -maxdepth 4 \
              -type f \
              -name 'pomchecker*' \
              -print >&2
            exit 1
          fi

          chmod +x "$pomchecker_bin"
          echo "$pomchecker_root/bin" >> "$GITHUB_PATH"

          test -x "$pomchecker_bin"

          echo "PomChecker executable:"
          ls -l "$pomchecker_bin"

          echo "PomChecker version:"
          "$pomchecker_bin" --version

      - name: Validate generated POM directly
        run: |
          set -euo pipefail

          pom_file="$(find devolay-java/build/staging-deploy \
            -type f \
            -name 'devolay-*.pom' \
            -print \
            -quit)"

          if [ -z "$pom_file" ]; then
            echo "Generated POM was not found." >&2
            exit 1
          fi

          echo "Validating generated POM: $pom_file"
          sed -n '1,260p' "$pom_file"

          mvn \
            --batch-mode \
            --no-transfer-progress \
            --file "$pom_file" \
            org.kordamp.maven:pomchecker-maven-plugin:1.15.0:check-maven-central \
            -Dchecker.release=true \
            -Dchecker.strict=true \
            -Dchecker.fail.on.error=true \
            -Dchecker.fail.on.warning=true

      - name: Upload signed bundle to Maven Central
        uses: jreleaser/release-action@v2
        with:
          version: "1.25.0"
          setup-java: false
          arguments: >-
            deploy
            --basedir .
            --config-file build/jreleaser-upload.yml
            --yolo
        env:
          JRELEASER_DEPLOY_MAVEN_MAVENCENTRAL_CENTRAL_TOKEN: ${{ secrets.JRELEASER_MAVENCENTRAL_TOKEN }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_DEPLOY_MAVEN_MAVENCENTRAL_CENTRAL_STAGE: UPLOAD

      - name: Record Central deployment
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          properties="out/jreleaser/output.properties"
          if [ ! -f "$properties" ]; then
            echo "JReleaser output.properties was not created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### Maven Central upload" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          grep -iE "deployment.?id|namespace" "$properties" \
            | tee -a "$GITHUB_STEP_SUMMARY" \
            || true

      - name: Upload complete staging result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: central-release-upload
          path: |
            build/universal-native-artifacts.jar
            devolay-java/build/staging-deploy
            out/jreleaser/trace.log
            out/jreleaser/output.properties
          if-no-files-found: warn
          retention-days: 7
